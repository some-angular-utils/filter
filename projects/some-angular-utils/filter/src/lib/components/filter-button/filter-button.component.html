<div class="sau-filter__actions-wrapper" [class.sau-filter__actions-wrapper--has-toggle]="hiddenCount > 0">
    @if (hiddenCount > 0) {
    <button type="button" class="sau-filter__toggle-hidden" (click)="toggleHidden()">
        <svg [class.is-open]="showAllFilters" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
        @if (!showAllFilters) { {{hiddenCount}} más } @else { Ver menos }
    </button>
    }
    <div class="sau-filter__split-btn" [class.sau-filter__split-btn--simple]="!hasOrderFields()">
        <button type="button" class="sau-filter__btn-main" (click)="onSearch()">
            {{searchButtonText}}
        </button>

        @if (hasOrderFields()) {
        <button type="button" class="sau-filter__btn-arrow" (click)="toggleOrderDropdown($event)">
            <svg [class.is-open]="showOrderDropdown" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
        </button>
        }
    </div>

    @if (showOrderDropdown && hasOrderFields()) {
    <div class="sau-filter__order-popover" (click)="$event.stopPropagation()">
        <div class="sau-filter__order-container" [class.sau-filter__order-container--no-anim]="dragAnimation === 'none'"
            [style.--sau-order-duration]="orderTransitionDuration" [style.--sau-order-easing]="orderTransitionEasing">
            <span class="sau-filter__order-title">{{orderTitle}}</span>

            @for (option of orderByFields; track option.field; let i = $index) {
            <div class="sau-filter__order-row" [class.is-dragging]="draggedIndex === i"
                [class.is-settling-immediate]="settlingIndex === i && settlingImmediate"
                [style.transform]="getRowTransform(i)">
                <div class="sau-filter__order-row-inner" [class.is-dragging]="draggedIndex === i">
                    <span class="sau-filter__order-drag-handle" aria-hidden="true"
                        (mousedown)="onOrderHandlePointerDown($event, i)"
                        (touchstart)="onOrderHandlePointerDown($event, i)">⠿</span>
                    <custom-input class="sau-filter__order-input" [label]="option.label" [type]="'checkbox'"
                        [formControlItem]="sortOrderGroup.controls[option.field]" trueLabel="Ascendente"
                        falseLabel="Descendente" nullLabel="Sin ordenar" trueIcon="↑" falseIcon="↓">
                    </custom-input>
                </div>
            </div>
            }
        </div>
    </div>
    }
</div>
